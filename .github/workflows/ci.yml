name: CI
on:
  push:
    branches: [main, feature/physical-local-db, feature/calendar-backlog, feature/backlog-categories]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit, recurrence, SQLite and loopback-service tests
        run: npm test
      - name: Install Electron
        run: npm install --no-audit --no-fund
      - name: Electron main + SQLite smoke
        run: xvfb-run -a npm run smoke:ci
      - name: Electron renderer + preload + IPC + SQLite
        run: xvfb-run -a npm run smoke:renderer
      - name: HTTP-served UI + loopback service + SQLite
        run: xvfb-run -a npm run smoke:http
      - name: Backlog folder + button + in-panel form
        run: xvfb-run -a npx electron electron/group-form-smoke.js --no-sandbox
      - name: Backlog delete only empty folders
        run: xvfb-run -a npx electron electron/backlog-delete-smoke.js --no-sandbox
      - name: Dashboard and backlog shared folder hierarchy
        run: xvfb-run -a npx electron electron/dashboard-backlog-smoke.js --no-sandbox
      - name: Dashboard new task stays in unified backlog
        run: xvfb-run -a npx electron electron/dashboard-create-smoke.js --no-sandbox
      - name: Calendar live backlog and dashboard completed task state
        run: xvfb-run -a npx electron electron/backlog-status-view-smoke.js --no-sandbox
