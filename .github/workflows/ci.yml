name: CI
on:
  push:
    branches: [main, feature/physical-local-db]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit and persistence tests
        run: npm test
      - name: Install Electron
        run: npm install --no-audit --no-fund
      - name: Electron + SQLite smoke test
        run: xvfb-run -a npm run smoke:ci
