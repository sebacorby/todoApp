name: Backlog UX
on:
  push:
    branches: [feature/backlog-ux-improvements]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backlog-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit tests
        run: npm test
      - name: Install Electron
        run: npm install --no-audit --no-fund
      - name: Backlog UX E2E
        run: xvfb-run -a npx electron electron/backlog-ux-smoke.js --no-sandbox
