<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>TodoApp</title><style>:root{color-scheme:dark;font-family:system-ui;background:#0b0d10;color:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:#0b0d10}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{padding:24px;border-right:1px solid #252c35;background:#0d1014}.brand{font-weight:800;font-size:18px;margin-bottom:28px}.nav{width:100%;border:0;border-radius:12px;padding:11px 12px;margin:4px 0;background:transparent;color:#aab3bf;text-align:left}.nav.active{background:#171c22;color:#f5f7fa}main{min-width:0}.head{padding:24px 32px;border-bottom:1px solid #252c35;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:24px}.add{border:0;border-radius:13px;padding:11px 15px;background:#a7baff;color:#10131a;font-weight:700}.content{padding:32px}.empty{min-height:420px;border:1px solid #252c35;border-radius:22px;display:grid;place-items:center;color:#8d98a7} @media(max-width:720px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #252c35}}</style></head><body><div class="app"><aside class="side"><div class="brand">TodoApp</div><button class="nav active" data-v="calendar">Calendario</button><button class="nav" data-v="dashboard">Dashboard</button></aside><main><header class="head"><h1 id="title">Calendario</h1><button class="add" id="add">+ Nueva tarea</button></header><section class="content" id="content"><div class="empty">Base local lista</div></section></main></div><script>const state={view:'calendar'};document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{state.view=b.dataset.v;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===b));document.querySelector('#title').textContent=state.view==='calendar'?'Calendario':'Dashboard'});const r=indexedDB.open('todoApp',1);r.onupgradeneeded=()=>{const d=r.result;const t=d.createObjectStore('tasks',{keyPath:'id',autoIncrement:true});t.createIndex('starts','starts');d.createObjectStore('settings',{keyPath:'key'})}</script></body></html>
