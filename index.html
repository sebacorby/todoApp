<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d10">
  <title>TodoApp</title>
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./src/dashboard.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">T</span><div><strong>TodoApp</strong><small>Tu tiempo, claro.</small></div></div>
      <nav aria-label="Navegación principal">
        <button class="nav-item active" data-view="calendar">Calendario</button>
        <button class="nav-item" data-view="dashboard">Dashboard</button>
      </nav>
      <small class="local-note">● Datos guardados localmente</small>
    </aside>

    <main class="main-column">
      <header class="topbar">
        <div><p class="eyebrow" id="eyebrow">PLANIFICACIÓN</p><h1 id="view-title">Calendario</h1></div>
        <button id="create-task" class="primary">+ <span>Nueva tarea</span></button>
      </header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="task-dialog" aria-labelledby="modal-title">
    <form id="task-form">
      <div class="modal-head">
        <div><p class="eyebrow">TAREA</p><h2 id="modal-title">Nueva tarea</h2></div>
        <button type="button" class="icon-button" id="close-modal" aria-label="Cerrar">×</button>
      </div>
      <input id="task-id" type="hidden">
      <label>Título<input id="task-title" maxlength="120" required autocomplete="off"></label>
      <label>Descripción<textarea id="task-description" rows="3"></textarea></label>
      <div class="form-grid">
        <label>Fecha<input id="task-date" type="date" required></label>
        <label>Hora<input id="task-time" type="time" required></label>
        <label>Hora final<input id="task-end" type="time" required></label>
        <label>Criticidad
          <select id="task-criticality">
            <option value="low">Baja</option><option value="medium" selected>Media</option>
            <option value="high">Alta</option><option value="urgent">Urgente</option>
          </select>
        </label>
      </div>
      <label>Estado
        <select id="task-status">
          <option value="not_started">Sin iniciar</option><option value="started">Iniciada</option>
          <option value="paused">Pausada</option><option value="blocked">Bloqueada</option>
          <option value="completed">Completa</option>
        </select>
      </label>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="modal-actions">
        <button type="button" id="delete-task" class="danger hidden">Eliminar</button>
        <span></span>
        <button type="button" id="cancel-modal" class="secondary">Cancelar</button>
        <button class="primary">Guardar</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="./src/app.js"></script>
  <script type="module" src="./src/dashboard.js"></script>
</body>
</html>
